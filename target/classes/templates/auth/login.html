<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <span class="login-badge">🎓 PUC Minas</span>
            <h1>Moeda Estudantil</h1>
            <p>Acesse com seu login e senha</p>
        </div>

        <div class="alert alert-error" th:if="${param.erro}">
            ❌ Login ou senha inválidos. Tente novamente.
        </div>
        <div class="alert alert-success" th:if="${param.saiu}">
            ✅ Você saiu do sistema com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group" style="margin-bottom:1rem">
                <label for="username">Login</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       placeholder="seu.login" required/>
            </div>
            <div class="form-group" style="margin-bottom:1.5rem">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="••••••" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                Entrar
            </button>
        </form>

        <div style="margin-top:1.5rem;text-align:center;font-size:.85rem;color:#64748b">
            Novo aluno?
            <a th:href="@{/alunos/novo}" style="color:#1a2744;font-weight:600">Cadastre-se aqui</a>
            &nbsp;|&nbsp;
            Nova empresa?
            <a th:href="@{/empresas/novo}" style="color:#1a2744;font-weight:600">Cadastre-se aqui</a>
        </div>
    </div>
</div>
</body>
</html>
