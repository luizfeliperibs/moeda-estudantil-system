<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Empresas Parceiras — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>🏢 Empresas Parceiras</h1>
            <a class="btn btn-primary" th:href="@{/empresas/novo}">+ Nova Empresa</a>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div th:if="${#lists.isEmpty(empresas)}" class="card" style="text-align:center;color:#64748b;padding:3rem">
            Nenhuma empresa parceira cadastrada.
        </div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(empresas)}">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>CNPJ</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="empresa : ${empresas}">
                        <td th:text="${empresa.id}"></td>
                        <td th:text="${empresa.nome}"></td>
                        <td th:text="${empresa.login}"></td>
                        <td th:text="${empresa.cnpj}"></td>
                        <td th:text="${empresa.email ?: '—'}"></td>
                        <td>
                            <a class="btn btn-outline btn-sm" th:href="@{/empresas/{id}/editar(id=${empresa.id})}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/empresas/{id}/excluir(id=${empresa.id})}">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
