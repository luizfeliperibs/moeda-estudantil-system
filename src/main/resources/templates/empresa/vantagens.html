<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Minhas vantagens — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>🏷️ Minhas vantagens</h1>
            <a class="btn btn-primary" th:href="@{/empresa/vantagens/novo}">+ Nova vantagem</a>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div th:if="${#lists.isEmpty(vantagens)}" class="card" style="text-align:center;color:#64748b;padding:3rem">
            Você ainda não cadastrou vantagens.
        </div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(vantagens)}">
            <table>
                <thead>
                    <tr><th>Foto</th><th>Nome</th><th>Descrição</th><th>Custo</th><th>Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vantagens}">
                        <td><img th:if="${v.fotoUrl}" th:src="@{${v.fotoUrl}}" th:alt="${v.nome}" class="thumb"/></td>
                        <td th:text="${v.nome}"></td>
                        <td th:text="${v.descricao}"></td>
                        <td th:text="${v.custoMoedas} + ' moedas'"></td>
                        <td>
                            <a class="btn btn-outline btn-sm" th:href="@{/empresa/vantagens/{id}/editar(id=${v.id})}">Editar</a>
                            <form th:action="@{/empresa/vantagens/{id}/excluir(id=${v.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Excluir esta vantagem?')">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
