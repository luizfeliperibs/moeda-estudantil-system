<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${form.id == null ? 'Nova vantagem' : 'Editar vantagem'} + ' — Moeda Estudantil'">Vantagem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1 th:text="${form.id == null ? '➕ Nova vantagem' : '✏️ Editar vantagem'}">Vantagem</h1>
            <a class="btn btn-outline" th:href="@{/empresa/vantagens}">← Voltar</a>
        </div>

        <div class="alert alert-error" th:if="${erro}">
            ❌ <span th:text="${erro}"></span>
        </div>

        <div class="card">
            <form th:action="${form.id == null ? '/empresa/vantagens' : '/empresa/vantagens/' + form.id}"
                  th:object="${form}" method="post" enctype="multipart/form-data" novalidate>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" th:field="*{nome}" maxlength="200"
                               th:classappend="${#fields.hasErrors('nome')} ? 'invalid'"/>
                        <span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>

                    <div class="form-group">
                        <label for="custoMoedas">Custo em moedas *</label>
                        <input type="number" id="custoMoedas" th:field="*{custoMoedas}" min="1"
                               th:classappend="${#fields.hasErrors('custoMoedas')} ? 'invalid'"/>
                        <span class="field-error" th:if="${#fields.hasErrors('custoMoedas')}" th:errors="*{custoMoedas}"></span>
                    </div>

                    <div class="form-group full">
                        <label for="descricao">Descrição *</label>
                        <textarea id="descricao" th:field="*{descricao}" rows="4"
                                  th:classappend="${#fields.hasErrors('descricao')} ? 'invalid'"></textarea>
                        <span class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                    </div>

                    <div class="form-group full">
                        <label for="foto"
                               th:text="${form.id == null ? 'Foto * (JPG, PNG, WEBP ou GIF, até 2 MB)' : 'Nova foto (opcional)'}">Foto</label>
                        <img th:if="${form.fotoUrl}" th:src="@{${form.fotoUrl}}" alt="Foto atual" class="thumb"/>
                        <input type="file" id="foto" name="foto" accept="image/jpeg,image/png,image/webp,image/gif"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"
                            th:text="${form.id == null ? 'Cadastrar vantagem' : 'Salvar alterações'}">Salvar</button>
                    <a class="btn btn-outline" th:href="@{/empresa/vantagens}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
