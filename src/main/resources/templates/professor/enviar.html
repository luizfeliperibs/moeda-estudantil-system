<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Enviar moedas — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>🪙 Enviar moedas</h1>
            <span class="saldo">Saldo: <strong th:text="${professor.saldo}">0</strong> moedas</span>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div class="card" th:if="${#lists.isEmpty(alunos)}" style="text-align:center;color:#64748b">
            Nenhum aluno cadastrado na sua instituição.
        </div>

        <div class="card" th:unless="${#lists.isEmpty(alunos)}">
            <form th:action="@{/professor/enviar}" th:object="${form}" method="post" novalidate>
                <div class="form-grid">

                    <div class="form-group full">
                        <label for="alunoId">Aluno *</label>
                        <select id="alunoId" th:field="*{alunoId}"
                                th:classappend="${#fields.hasErrors('alunoId')} ? 'invalid'">
                            <option value="">Selecione…</option>
                            <option th:each="a : ${alunos}" th:value="${a.id}"
                                    th:text="${a.nome} + ' — ' + ${a.curso}">Aluno</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('alunoId')}"
                              th:errors="*{alunoId}"></span>
                    </div>

                    <div class="form-group">
                        <label for="valor">Quantidade de moedas *</label>
                        <input type="number" id="valor" th:field="*{valor}" min="1"
                               th:classappend="${#fields.hasErrors('valor')} ? 'invalid'"/>
                        <span class="field-error" th:if="${#fields.hasErrors('valor')}"
                              th:errors="*{valor}"></span>
                    </div>

                    <div class="form-group full">
                        <label for="mensagem">Motivo do reconhecimento *</label>
                        <textarea id="mensagem" th:field="*{mensagem}" rows="4" maxlength="1000"
                                  th:classappend="${#fields.hasErrors('mensagem')} ? 'invalid'"
                                  placeholder="Ex.: Excelente participação no projeto integrador"></textarea>
                        <span class="field-error" th:if="${#fields.hasErrors('mensagem')}"
                              th:errors="*{mensagem}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Enviar moedas</button>
                    <a class="btn btn-outline" th:href="@{/home}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
