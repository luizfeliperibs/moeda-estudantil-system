<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alunos — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>👩‍🎓 Alunos</h1>
            <a class="btn btn-primary" th:href="@{/alunos/novo}">+ Novo Aluno</a>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div th:if="${#lists.isEmpty(alunos)}" class="card" style="text-align:center;color:#64748b;padding:3rem">
            Nenhum aluno cadastrado.
        </div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(alunos)}">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Curso</th>
                        <th>Instituição</th>
                        <th>Saldo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${alunos}">
                        <td th:text="${aluno.id}"></td>
                        <td th:text="${aluno.nome}"></td>
                        <td th:text="${aluno.login}"></td>
                        <td th:text="${aluno.cpf}"></td>
                        <td th:text="${aluno.email}"></td>
                        <td th:text="${aluno.curso}"></td>
                        <td th:text="${aluno.instituicao != null ? aluno.instituicao.nome : '—'}"></td>
                        <td th:text="${aluno.saldo} + ' 🪙'"></td>
                        <td>
                            <a class="btn btn-outline btn-sm" th:href="@{/alunos/{id}/editar(id=${aluno.id})}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/alunos/{id}/excluir(id=${aluno.id})}">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
