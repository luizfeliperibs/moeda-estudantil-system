<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vantagens — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>🎁 Vantagens</h1>
            <span class="saldo">Saldo: <strong th:text="${aluno.saldo}">0</strong> moedas</span>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div th:if="${#lists.isEmpty(vantagens)}" class="card" style="text-align:center;color:#64748b;padding:3rem">
            Nenhuma vantagem disponível no momento.
        </div>

        <div class="vantagem-grid" th:unless="${#lists.isEmpty(vantagens)}">
            <div class="vantagem-card" th:each="v : ${vantagens}">
                <img th:if="${v.fotoUrl}" th:src="@{${v.fotoUrl}}" th:alt="${v.nome}"/>
                <div class="vantagem-body">
                    <h2 th:text="${v.nome}">Vantagem</h2>
                    <small th:text="${v.empresa.nome}">Empresa</small>
                    <p th:text="${v.descricao}">Descrição</p>
                    <div class="vantagem-rodape">
                        <strong th:text="${v.custoMoedas} + ' moedas'">10 moedas</strong>
                        <form th:action="@{/aluno/vantagens/{id}/resgatar(id=${v.id})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm"
                                    th:disabled="${aluno.saldo < v.custoMoedas}">Resgatar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
