<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Extrato — Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{layout/base :: navbar}"></div>

    <main>
        <div class="page-header">
            <h1>📄 Meu extrato</h1>
            <span class="saldo">Saldo: <strong th:text="${aluno.saldo}">0</strong> moedas</span>
        </div>

        <div th:replace="~{layout/base :: flash}"></div>

        <div th:if="${#lists.isEmpty(itens)}" class="card" style="text-align:center;color:#64748b;padding:3rem">
            Nenhuma movimentação ainda.
        </div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(itens)}">
            <table>
                <thead>
                    <tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Moedas</th></tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${itens}">
                        <td th:text="${#temporals.format(i.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${i.tipo == 'RECEBIDO' ? 'Recebido' : 'Resgate'}"></td>
                        <td th:text="${i.descricao}"></td>
                        <td th:text="${i.valor > 0 ? '+' + i.valor : i.valor}"
                            th:classappend="${i.valor < 0} ? 'valor-saida' : 'valor-entrada'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
