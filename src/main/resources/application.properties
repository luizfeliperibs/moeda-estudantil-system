spring.application.name=moeda-estudantil
spring.profiles.active=dev

# Thymeleaf
spring.thymeleaf.cache=false

# Spring Security - login page
spring.security.filter.dispatcher-types=request,error,async

# Upload de fotos das vantagens
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# E-mail: sem spring.mail.host o envio é apenas registrado no log (dev).
# Em produção defina spring.mail.host/port/username/password.
app.mail.from=no-reply@moedaestudantil.local
